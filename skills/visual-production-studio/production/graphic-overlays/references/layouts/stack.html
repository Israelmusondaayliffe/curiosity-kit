<!--
  Layout: stack. Speaker/video above, full-width statement card below.
  zone="lower-third" is the planning label; the default bottom-30-percent zone is
  NOT this layout. Set BOTH explicit paired rectangles (x,y,width,height):
    1920x1080: video (14,14,1892,548); card (14,576,1892,490).
    1080x1920: video (0,0,1080,844); card (0,869,1080,1051).
    1080x1350: video (0,0,1080,593); card (0,611,1080,739).
  The landscape outer margin is 14; the gap is scaled from 14/1080 of canvas height.
  This explicit paired geometry preserves the source video heights and keeps the
  card entirely on canvas. Use geometry.mjs for other sizes. The preview below
  uses the exact landscape rectangles. Reflow summaries to this shorter host.
  Move the outer #video-wrap, not the inner photo; retain source with object-fit:contain.
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>layout · stack (video top, card bottom)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0c12;
        color: #fff;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        transform-origin: top left;
        transform: scale(0.5);
        background: #0a0c12;
        overflow: hidden;
      }
      .region {
        position: absolute;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          600 24px/1.3 ui-monospace,
          monospace;
        letter-spacing: 0.12em;
      }
      .video-region {
        left: 14px;
        top: 14px;
        width: 1892px;
        height: 548px;
        background: #1a1f2e;
        background-image: repeating-linear-gradient(
          45deg,
          transparent 0 12px,
          rgba(255, 255, 255, 0.05) 12px 13px
        );
      }
      .card-region {
        left: 14px;
        top: 576px;
        width: 1892px;
        height: 490px;
        background: #f1ead8;
        color: #1a1d2b;
      }
      .label {
        padding: 12px 18px;
        border: 1.5px solid currentColor;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="region video-region"><span class="label">VIDEO · 1892×548</span></div>
      <div class="region card-region"><span class="label">CARD · 1892×490</span></div>
    </div>
  </body>
</html>
