<!--
  Layout: picture-in-picture. zone="fullscreen"; card fills the canvas.
  Paint card at z-index 2 and video at z-index 4. Reserve the selected corner in
  the card content. Clean frame plus pill radius/ring/shadow is the default.
  Exact aspect-preserving top-right video rectangles (x,y,width,height):
    1920x1080, 16:9 source: (1432,28,460,258.75).
    1920x1080, 9:16 source: (1644,28,248,440.888889).
    1080x1920 or 1080x1350, 16:9 source: (692,28,360,202.5).
    1080x1920 or 1080x1350, 9:16 source: (740,28,312,554.666667).
  Fractional CSS pixels preserve source aspect; let the renderer rasterize them.
  In 4:5, the full portrait-source pill fits. Never shrink height alone to 390.
  geometry.mjs fits arbitrary source aspect uniformly within available bounds.
  For bottom-right use y=canvasHeight-videoHeight-margin; left corners use x=margin.
  Rounded video viewport uses 14px radius; outer wrapper supplies white/black rings
  and shadow. Animate outer #video-wrap on the master timeline, not media dimensions.
  Card background may be opaque because video intentionally paints above it.
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>layout · pip (card hero + video pill)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0c12;
        color: #fff;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        transform-origin: top left;
        transform: scale(0.5);
        background: #0a0c12;
        overflow: hidden;
      }
      .region {
        position: absolute;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          600 24px/1.3 ui-monospace,
          monospace;
        letter-spacing: 0.12em;
      }
      .card-region {
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        background: #f1ead8;
        color: #1a1d2b;
      }
      .video-region {
        left: 1432px;
        top: 28px;
        width: 460px;
        height: 258.75px;
        background: #1a1f2e;
        color: #fff;
        border-radius: 14px;
        box-shadow:
          0 24px 60px -20px rgba(0, 0, 0, 0.45),
          0 0 0 4px rgba(255, 255, 255, 0.7),
          0 0 0 5px rgba(0, 0, 0, 0.18);
        background-image: repeating-linear-gradient(
          45deg,
          transparent 0 12px,
          rgba(255, 255, 255, 0.05) 12px 13px
        );
      }
      .label {
        padding: 12px 18px;
        border: 1.5px solid currentColor;
        border-radius: 4px;
      }
      .v-label {
        font:
          600 14px/1 ui-monospace,
          monospace;
        letter-spacing: 0.14em;
        padding: 6px 10px;
        border: 1px solid currentColor;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="region card-region"><span class="label">CARD · 1920×1080 (full-bleed)</span></div>
      <div class="region video-region"><span class="v-label">VIDEO · 460×258.75 PIP</span></div>
    </div>
  </body>
</html>
